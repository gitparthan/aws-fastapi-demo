
name: FastAPI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v



  deploy:
    name: Deploy FastAPI to AWS EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: fastapi-ec2-deploy
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::191637460765:role/GitHubActions-EC2-Deploy-Role
          aws-region: us-east-1

      - name: Deploy through Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0736038e8c6a5dfff \
            --document-name FastAPI-Deploy \
            --comment "FastAPI deployment from GitHub Actions" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0736038e8c6a5dfff

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0736038e8c6a5dfff \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent}' \
            --output json

